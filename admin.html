<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Panel - Bengali Learning Academy</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f7f6;
            margin: 0;
            padding: 0;
        }
        .header {
            background-color: #000080;
            color: white;
            text-align: center;
            padding: 20px;
        }
        .header h1 {
            margin: 0;
            font-size: 24px;
        }
        .header h2 {
            margin: 5px 0 0 0;
            font-size: 16px;
            color: #FFD700;
        }
        .container {
            padding: 20px;
            max-width: 600px;
            margin: 0 auto;
        }
        .form-box {
            background: white;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
        }
        .form-box h3 {
            color: #000080;
            text-align: center;
            margin-top: 0;
        }
        input, select, button {
            width: 100%;
            padding: 12px;
            margin: 10px 0;
            border: 1px solid #ccc;
            border-radius: 5px;
            box-sizing: border-box;
            font-size: 16px;
        }
        button {
            background-color: #FFD700;
            color: #000080;
            font-weight: bold;
            border: none;
            cursor: pointer;
        }
        button:hover {
            background-color: #e6c200;
        }
    </style>
</head>
<body>

    <div class="header">
        <h1>ABHIJIT MONDAL</h1>
        <h2>BENGALI LEARNING ACADEMY (ADMIN)</h2>
    </div>

    <div class="container">
        <div class="form-box">
            <h3>স্টাডি মেটেরিয়াল আপলোড করুন</h3>
            <form id="uploadForm">
                <label for="classSelect"><b>ক্লাস নির্বাচন করুন:</b></label>
                <select id="classSelect" required>
                    <option value="" disabled 
<select id="classSelect" required>
    <option value="" disabled selected>ক্লাস সিলেক্ট করুন</option>
    <option value="Class_6">Class 6</option>
    <option value="Class_7">Class 7</option>
    <option value="Class_8">Class 8</option>
    <option value="Class_9">Class 9</option>
    <option value="Class_10">Class 10</option>
</select>

                <label for="topicName"><b>টপিক বা বিষয়ের নাম:</b></label>
                <input type="text" id="topicName" placeholder="যেমন: ব্যাকরণ - সমাস" required>

                <label for="driveLink"><b>Google Drive লিংক:</b></label>
                <input type="url" id="driveLink" placeholder="এখানে পিডিএফ বা নোটসের লিংক পেস্ট করুন" required>

                <button type="submit">আপলোড করুন</button>
            </form>
        </div>
    </div>

    <!-- Firebase SDK Setup -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getDatabase, ref, push } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";

        // Your Firebase configuration
        const firebaseConfig = {
            apiKey: "AIzaSyCWSBFvyn2qkAlpVad0yRdZxsuCE7eePdU",
            authDomain: "bengali-learning-academy.firebaseapp.com",
            databaseURL: "https://bengali-learning-academy-default-rtdb.firebaseio.com",
            projectId: "bengali-learning-academy",
            storageBucket: "bengali-learning-academy.firebasestorage.app",
            messagingSenderId: "90504318339",
            appId: "1:90504318339:web:42724d1df6122a7d2dfab6",
            measurementId: "G-X6LR3QPK62"
        };

        // Initialize Firebase
        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);

        // Handle form submission
        document.getElementById("uploadForm").addEventListener("submit", function(e) {
            e.preventDefault();
            
            const className = document.getElementById("classSelect").value;
            const topicName = document.getElementById("topicName").value;
            const driveLink = document.getElementById("driveLink").value;

            // Save to database
            push(ref(db, 'StudyMaterials/' + className), {
                topic: topicName,
                link: driveLink,
                timestamp: Date.now()
            }).then(() => {
                alert("আপনার নোটস সফলভাবে ডেটাবেসে যোগ হয়েছে!");
                document.getElementById("uploadForm").reset();
            }).catch((error) => {
                alert("কোথাও সমস্যা হয়েছে: " + error.message);
            });
        });
    </script>
</body>
</html>

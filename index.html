<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bengali Learning Academy</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f7f6;
            margin: 0;
            padding: 0;
        }
        .header {
            background-color: #000080;
            color: white;
            text-align: center;
            padding: 20px;
        }
        .header h1 {
            margin: 0;
            font-size: 24px;
        }
        .header h2 {
            margin: 5px 0 0 0;
            font-size: 16px;
            color: #FFD700;
        }
        .container {
            padding: 20px;
            max-width: 600px;
            margin: 0 auto;
        }
        .selector-box {
            background: white;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
            margin-bottom: 20px;
        }
        select {
            width: 100%;
            padding: 12px;
            margin-top: 10px;
            border: 1px solid #ccc;
            border-radius: 5px;
            font-size: 16px;
        }
        .note-card {
            background: white;
            border-left: 5px solid #FFD700;
            padding: 15px;
            margin-bottom: 15px;
            border-radius: 5px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        .note-title {
            font-size: 18px;
            color: #000080;
            font-weight: bold;
        }
        .download-btn {
            background-color: #000080;
            color: white;
            text-align: center;
            padding: 10px;
            text-decoration: none;
            border-radius: 5px;
            font-weight: bold;
        }
        .download-btn:hover {
            background-color: #000066;
        }
        .no-data {
            text-align: center;
            color: #ff0000;
            font-weight: bold;
            margin-top: 20px;
        }
    </style>
</head>
<body>

    <div class="header">
        <h1>ABHIJIT MONDAL</h1>
        <h2>BENGALI LEARNING ACADEMY</h2>
    </div>

    <div class="container">
        <div class="selector-box">
            <label for="classSelect"><b>আপনার ক্লাস নির্বাচন করুন:</b></label>
            <select id="classSelect">
                <option value="" disabled selected>ক্লাস সিলেক্ট করুন</option>
                <option value="Class_6">Class 6</option>
                <option value="Class_7">Class 7</option>
                <option value="Class_8">Class 8</option>
                <option value="Class_9">Class 9</option>
                <option value="Class_10">Class 10</option>
            </select>
        </div>

        <div id="notesContainer">
            <!-- নোটসগুলো এখানে দেখাবে -->
        </div>
    </div>

    <!-- Firebase SDK Setup -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getDatabase, ref, onValue } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";

        // Your Firebase configuration
        const firebaseConfig = {
            apiKey: "AIzaSyCWSBFvyn2qkAlpVad0yRdZxsuCE7eePdU",
            authDomain: "bengali-learning-academy.firebaseapp.com",
            databaseURL: "https://bengali-learning-academy-default-rtdb.firebaseio.com",
            projectId: "bengali-learning-academy",
            storageBucket: "bengali-learning-academy.firebasestorage.app",
            messagingSenderId: "90504318339",
            appId: "1:90504318339:web:42724d1df6122a7d2dfab6",
            measurementId: "G-X6LR3QPK62"
        };

        // Initialize Firebase
        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);

        // Fetch Data when class is selected
        document.getElementById("classSelect").addEventListener("change", function() {
            const className = this.value;
            const notesContainer = document.getElementById("notesContainer");
            
            notesContainer.innerHTML = "<p style='text-align:center;'>নোটস খোঁজা হচ্ছে...</p>";

            const dbRef = ref(db, 'StudyMaterials/' + className);
            onValue(dbRef, (snapshot) => {
                notesContainer.innerHTML = ''; // Clear loading text
                if (snapshot.exists()) {
                    snapshot.forEach((childSnapshot) => {
                        const data = childSnapshot.val();
                        
                        // Create card HTML
                        const card = document.createElement("div");
                        card.className = "note-card";
                        card.innerHTML = `
                            <div class="note-title">📚 ${data.topic}</div>
                            <a href="${data.link}" target="_blank" class="download-btn">নোটস দেখুন / ডাউনলোড করুন</a>
                        `;
                        // Add card to container (newest first)
                        notesContainer.prepend(card);
                    });
                } else {
                    notesContainer.innerHTML = "<p class='no-data'>এই ক্লাসের জন্য এখনো কোনো নোটস আপলোড করা হয়নি।</p>";
                }
            });
        });
    </script>
</body>
    <script>
    var userId = prompt("অ্যাকাডেমিতে প্রবেশ করতে ইউজার আইডি (User ID) দিন:");
    var password = prompt("এবার পাসওয়ার্ড (Password) দিন:");

    if (userId !== "student" || password !== "1234") {
        alert("ভুল আইডি বা পাসওয়ার্ড! আপনি সঠিক তথ্য ছাড়া পেজটি দেখতে পারবেন না।");
        document.body.innerHTML = "<h2 style='text-align:center; margin-top:50px; color:red;'>ভুল আইডি বা পাসওয়ার্ড! দয়া করে পেজটি রিফ্রেশ করে আবার চেষ্টা করুন।</h2>";
    }
    </script>
    
</html>
